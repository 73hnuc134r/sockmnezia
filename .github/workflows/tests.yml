name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 29.0.14206865

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      # Includes the loopback integration tests with real Xray upstreams (core/runner).
      - run: go test -race -count=1 ./...
      - name: CLI builds for desktop targets
        run: |
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} go build -trimpath -ldflags "-s -w -checklinkname=0" -o /dev/null ./cmd/sockmnezia
          done

  # Builds the Go core as an AAR and the debug APK; runs lint and the JVM unit tests.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Strings are generated from tool/strings.py
        run: python3 tool/strings.py --check

      - uses: actions/setup-go@v6
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # The Go core AAR only depends on the core's Go sources, the build script and the NDK: when none of them
      # changed (app-only changes), reuse the AAR and skip the NDK and the ~1.5 min gomobile build.
      - name: Cached Go core (AAR)
        id: aar
        uses: actions/cache@v6
        with:
          path: android/app/libs/sockmnezia-core.aar
          key: aar-${{ env.NDK_VERSION }}-${{ hashFiles('core/**/*.go', '!core/**/*_test.go', 'core/go.mod', 'core/go.sum', 'tool/build-aar.sh') }}

      # The NDK is not on the runner image in this version; cache it instead of downloading it every run.
      - uses: actions/cache@v6
        if: steps.aar.outputs.cache-hit != 'true'
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      - name: Install SDK platform (and the NDK when the AAR is rebuilt)
        env:
          NEED_NDK: ${{ steps.aar.outputs.cache-hit != 'true' }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          pkgs=("platforms;android-37.0")
          [[ "$NEED_NDK" == "true" ]] && pkgs+=("ndk;$NDK_VERSION")
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "${pkgs[@]}" > /dev/null

      - name: Build the Go core (AAR)
        if: steps.aar.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
        run: bash tool/build-aar.sh

      - name: Lint, unit tests, debug APK
        working-directory: android
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-debug.html
